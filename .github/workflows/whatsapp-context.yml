name: WhatsApp support tests

on:
  pull_request:
    paths:
      - '.github/workflows/whatsapp-context.yml'
      - 'app/**/whatsapp/**'
      - 'app/javascript/whatsapp_support.js'
      - 'app/assets/stylesheets/whatsapp_support.css'
      - 'config/**'
      - 'db/**'
      - 'test/**/*whatsapp*'
      - 'test/**/whatsapp/**'
      - 'test/test_helper.rb'
      - 'Gemfile*'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whatsapp-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whatsapp:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: honey_whatsapp_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      RAILS_ENV: test
      PARALLEL_WORKERS: '1'
      TEST_DATABASE_URL: mysql2://root:test-only@127.0.0.1:3306/honey_whatsapp_ci
      SHOPIFY_API_KEY: ci-fake-key
      SHOPIFY_API_SECRET: ci-fake-secret
      CHASE_ORDERS_TOKEN: ci-fake-token
      SECRET_KEY_BASE: ci-test-only-secret-key-base-0123456789abcdef0123456789abcdef0123456789
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install MySQL build dependencies
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install asset dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: node --check app/javascript/whatsapp_support.js
      - name: Test conversation context and summary interactions
        run: node --test test/javascript/whatsapp_support_test.cjs
      - name: Prepare disposable test database
        run: |
          bundle exec rails runner 'abort "Unexpected database" unless Rails.env.test? && ActiveRecord::Base.connection_db_config.database == "honey_whatsapp_ci"'
          # Old migrations are not a reliable bootstrap; this service starts empty.
          bundle exec rails db:schema:load db:migrate
      - name: Verify summary migration can roll back and reapply
        run: |
          bundle exec rails db:migrate:down VERSION=20261031120000
          bundle exec rails db:migrate:up VERSION=20261031120000
      - name: Run WhatsApp controller, service and model tests
        run: find test -path '*whatsapp*' -name '*_test.rb' -print0 | xargs -0 bundle exec rails test
