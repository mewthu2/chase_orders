pt-BR:
  devise:
    confirmations:
      confirmed: Seu e-mail foi confirmado com sucesso.
      send_instructions: Em alguns minutos você receberá um e-mail com instruções para confirmar seu endereço.
      send_paranoid_instructions: Se o seu e-mail existir em nossa base, em alguns minutos você receberá as instruções de confirmação.
    failure:
      already_authenticated: Você já está logado.
      inactive: Sua conta ainda não foi ativada.
      invalid: "%{authentication_keys} ou senha inválidos."
      locked: Sua conta está bloqueada.
      last_attempt: Você tem mais uma tentativa antes de sua conta ser bloqueada.
      not_found_in_database: "%{authentication_keys} ou senha inválidos."
      timeout: Sua sessão expirou. Faça login novamente para continuar.
      unauthenticated: Para continuar, faça login ou registre-se.
      unconfirmed: Você precisa confirmar seu e-mail antes de continuar.
    mailer:
      confirmation_instructions:
        subject: Instruções de confirmação
      reset_password_instructions:
        subject: Instruções para redefinir sua senha
      unlock_instructions:
        subject: Instruções de desbloqueio
      email_changed:
        subject: E-mail alterado
      password_change:
        subject: Senha alterada
    omniauth_callbacks:
      failure: 'Não foi possível autenticar você com %{kind} porque "%{reason}".'
      success: Autenticado com sucesso pela conta %{kind}.
    passwords:
      no_token: Você só pode acessar esta página a partir do link de redefinição de senha. Se foi isso que você fez, confira se usou o endereço completo.
      send_instructions: Em alguns minutos você receberá um e-mail com instruções para redefinir sua senha.
      send_paranoid_instructions: Se o seu e-mail existir em nossa base, em alguns minutos você receberá um link para redefinir sua senha.
      updated: Sua senha foi alterada com sucesso. Você já está logado.
      updated_not_active: Sua senha foi alterada com sucesso.
    registrations:
      destroyed: Sua conta foi cancelada com sucesso. Esperamos vê-lo novamente em breve.
      signed_up: Cadastro realizado com sucesso.
      signed_up_but_inactive: Cadastro realizado, mas sua conta ainda não está ativa.
      signed_up_but_locked: Cadastro realizado, mas sua conta está bloqueada.
      signed_up_but_unconfirmed: Enviamos uma mensagem com um link de confirmação para o seu e-mail. Abra o link para ativar sua conta.
      update_needs_confirmation: Sua conta foi atualizada, mas precisamos verificar o novo e-mail. Confira sua caixa de entrada e abra o link de confirmação.
      updated: Sua conta foi atualizada com sucesso.
      updated_but_not_signed_in: Sua conta foi atualizada com sucesso, mas sua senha mudou. Faça login novamente.
    sessions:
      signed_in: Login efetuado com sucesso.
      signed_out: Logout efetuado com sucesso.
      already_signed_out: Logout efetuado com sucesso.
    unlocks:
      send_instructions: Em alguns minutos você receberá um e-mail com instruções para desbloquear sua conta.
      send_paranoid_instructions: Se a sua conta existir, em alguns minutos você receberá as instruções de desbloqueio.
      unlocked: Sua conta foi desbloqueada com sucesso. Você já está logado.
  errors:
    messages:
      already_confirmed: já foi confirmado, tente fazer login
      confirmation_period_expired: precisa ser confirmado em até %{period}, solicite um novo
      expired: expirou, solicite um novo
      not_found: não encontrado
      not_locked: não estava bloqueado
      not_saved:
        one: "Não foi possível salvar %{resource}: 1 erro"
        other: "Não foi possível salvar %{resource}: %{count} erros"
