default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("MYSQL_MAX_THREADS") { 50 } %>

development:
  <<: *default
  host: <%= ENV['PRODUCTION_DATABASE_HOST'] %>
  username: <%= ENV['PRODUCTION_DATABASE_USERNAME'] %>
  password: <%= ENV['PRODUCTION_DATABASE_PASSWORD'] %>
  database: <%= ENV['PRODUCTION_DATABASE_NAME'] %>
  port: <%= ENV['PRODUCTION_DATABASE_PORT'] %>

test:
  <<: *default
  url: <%= ENV['TEST_DATABASE_URL'] %>

production:
  <<: *default
  host: <%= ENV['PRODUCTION_DATABASE_HOST'] %>
  username: <%= ENV['PRODUCTION_DATABASE_USERNAME'] %>
  password: <%= ENV['PRODUCTION_DATABASE_PASSWORD'] %>
  database: <%= ENV['PRODUCTION_DATABASE_NAME'] %>
  port: <%= ENV['PRODUCTION_DATABASE_PORT'] %>

# Optional new sandbox. Never falls back to PRODUCTION_DATABASE_*.
whatsapp_preview:
  <<: *default
  url: <%= ENV['HONEY_WHATSAPP_PREVIEW_DATABASE_URL'] %>
